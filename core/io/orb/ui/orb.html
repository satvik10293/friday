<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FRIDAY</title>
  <link rel="stylesheet" href="orb.css" />
</head>
<body>
  <!-- =============================================================
       FRIDAY Orb UI — self-contained (no build step, no network).
       Purely reactive: it only visualises what FRIDAY sends via the
       global window.FRIDAY object, and reports interactions back
       through window.pywebview.api. See orb.js for the frozen contract.
       ============================================================= -->
  <div id="app">

    <!-- Hidden SVG filters: feTurbulence displacement ("4D" surface) + bloom -->
    <svg id="orb-filters" aria-hidden="true" focusable="false">
      <defs>
        <filter id="d4" x="-35%" y="-35%" width="170%" height="170%"
                color-interpolation-filters="sRGB">
          <feTurbulence id="tb1" type="fractalNoise"
                        baseFrequency="0.30 0.30" numOctaves="6" seed="42" result="n1" />
          <feTurbulence id="tb2" type="turbulence"
                        baseFrequency="0.50 0.50" numOctaves="3" seed="99" result="n2" />
          <feMerge result="nm">
            <feMergeNode in="n1" />
            <feMergeNode in="n2" />
          </feMerge>
          <feDisplacementMap id="disp" in="SourceGraphic" in2="nm"
                             scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="7" result="b" />
          <feMerge>
            <feMergeNode in="b" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
    </svg>

    <!-- State badge (top-centre) -->
    <div id="badge" class="badge">
      <span id="badge-emoji" class="badge-emoji">&#128564;</span>
      <span id="badge-label" class="badge-label">Idle</span>
    </div>

    <!-- Speech panel (above the orb, auto-hidden; shown only while speaking) -->
    <div id="speech" class="speech" aria-live="polite">
      <div class="speech-head">
        <span class="speech-dots"><i></i><i></i><i></i></span>
        <span class="speech-tag">FRIDAY</span>
      </div>
      <p id="speech-text" class="speech-text"></p>
    </div>

    <!-- Orb (centred) -->
    <div id="stage" class="stage">
      <div id="orb" class="orb" title="FRIDAY">
        <div id="halo" class="halo"></div>
        <div id="orb-wrap" class="orb-wrap">
          <div id="glow" class="glow"></div>
          <div id="sphere" class="sphere"></div>
          <div class="specular"></div>
          <div id="rim" class="rim"></div>
          <div id="emotion" class="emotion"></div>
          <div class="rings">
            <div class="ring-slot slot1"><div id="ring1" class="ring ring1"></div></div>
            <div class="ring-slot slot2"><div id="ring2" class="ring ring2"></div></div>
            <div class="ring-slot slot3"><div id="ring3" class="ring ring3"></div></div>
          </div>
        </div>
        <div id="flash" class="flash"></div>
      </div>
    </div>

    <!-- Mode indicator (voice / text) -->
    <div id="mode" class="mode">
      <span id="mode-icon" class="mode-icon">&#127908;</span>
      <span id="mode-label" class="mode-label">VOICE</span>
    </div>

    <!-- Subtle interaction hint -->
    <div class="hint">Double-click &middot; dashboard &nbsp;|&nbsp; Right-click &middot; menu</div>

    <!-- Right-click context menu -->
    <div id="context-menu" class="context-menu" hidden></div>

    <!-- Dashboard overlay (secondary interface) -->
    <div id="dashboard" class="dashboard" hidden></div>

  </div>

  <script src="orb.js"></script>
</body>
</html>
